<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>AtkynsonNext NF</family>
      <family>Noto Sans</family>              <!-- Fallback for general Unicode -->
      <family>Noto Color Emoji</family>       <!-- Fallback for emojis -->
      <family>Noto Sans CJK JP</family>       <!-- Fallback for Japanese Chinese and Korean -->
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>             <!-- Fallback for serif text -->
      <family>Noto Serif CJK JP</family>      <!-- Fallback for Japanese serif -->
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>AtkynsonMono NF</family>
      <family>Noto Sans Mono</family>         <!-- Fallback for monospace Unicode -->
      <family>Noto Sans Mono CJK JP</family>  <!-- Fallback for Japanese monospace -->
      <family>Noto Color Emoji</family>       <!-- Fallback for emojis -->
    </prefer>
  </alias>

</fontconfig>
