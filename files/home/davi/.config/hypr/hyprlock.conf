source = ~/.config/hypr/catppuccin-mocha.conf

# Hyprlock
# ========
# Reference: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# The lock screen looks like a terminal: the same background and font as kitty,
# with the prompt in the top-left corner of the laptop screen. A red border on
# every monitor (instead of the sapphire border of focused windows) makes it
# clear that this is not a real terminal.
#
# Layout math, for font_size 12 (Atkinson Mono NF):
#     - Sizes are points: 12pt = 16px
#     - One character is 10px wide, one line is 23px tall
#     - Text starts at x = 4; line N starts at y = 2 + 23 * N (from the top)
# If you change the font size, update the positions below.

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Same motion as the desktop's "global" animation (hyprland-eyecandy.lua). When
# locking before sleep, hypridle starts hyprlock with --no-fade-in (see
# hypridle.conf), so the screen is fully covered before the computer suspends.
bezier = easeOutExpo, 0.16, 1, 0.3, 1
animation = global, 1, 3, easeOutExpo

background {
    color = $base
}

# Red border on every monitor. The border is drawn outside the shape, so the
# shape is 2px smaller than the screen (1920x1080) to keep the border visible.
shape {
    size = 1918, 1078
    color = rgba(00000000)
    border_size = 1
    border_color = $red
    rounding = 0
    halign = center
    valign = center
}

# Line 0: the command, like the shell prompt in ~/.bashrc (PS1='[\w]\$ ')
label {
    monitor = eDP-1
    text = [~]$ hyprlock
    font_family = Atkinson Mono NF
    font_size = 12
    color = $text
    halign = left
    valign = top
    position = 4, -2
}

# Line 1: when the screen was locked (the command runs only once)
label {
    monitor = eDP-1
    text = cmd[update:0] echo "Locked at: $(date +%H:%M)"
    font_family = Atkinson Mono NF
    font_size = 12
    color = $text
    halign = left
    valign = top
    position = 4, -25
}

# Line 2: live clock
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "Now:       $(date +%H:%M:%S)"
    font_family = Atkinson Mono NF
    font_size = 12
    color = $text
    halign = left
    valign = top
    position = 4, -48
}

# Line 3: the password prompt. The typed characters start right after
# "Password: " (10 characters = 100px)
label {
    monitor = eDP-1
    text = Password:
    font_family = Atkinson Mono NF
    font_size = 12
    color = $text
    halign = left
    valign = top
    position = 4, -71
}

input-field {
    monitor = eDP-1
    # One line tall (24px). The typed characters are sized from the height:
    # 24 * dots_size (0.5) = 12pt, the same as the labels
    size = 400, 24
    halign = left
    valign = top
    position = 104, -71

    # No box: the input looks like plain terminal text
    rounding = 0
    outline_thickness = 0
    inner_color = $base
    check_color = $base
    fail_color = $base
    fade_on_empty = false

    font_family = Atkinson Mono NF
    font_color = $text
    dots_text_format = *
    dots_size = 0.5
    dots_spacing = 0
    dots_center = false

    # No text in the field: the fail message is the label on line 4
    placeholder_text =
    fail_text =
}

# Line 4: like sudo, "Sorry, try again." after a failed attempt. Labels using
# $ATTEMPTS are refreshed after every failed attempt, and $ATTEMPTS is replaced
# before the command runs, so this prints nothing until the first failure.
label {
    monitor = eDP-1
    text = cmd[update:0] [ $ATTEMPTS -gt 0 ] && echo "<span foreground='##f38ba8'>Sorry, try again.</span>"
    font_family = Atkinson Mono NF
    font_size = 12
    color = $text
    halign = left
    valign = top
    position = 4, -94
}
