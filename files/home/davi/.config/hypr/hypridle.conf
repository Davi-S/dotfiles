general {
    lock_cmd = pidof hyprlock || hyprlock                               # avoid starting multiple hyprlock instances.
    # Lock before suspend, without the fade-in: hypridle lets the computer sleep as
    # soon as the lock exists, so a fading lock would still be see-through when it
    # sleeps, and the screen content would show for a moment after waking up.
    before_sleep_cmd = pidof hyprlock || hyprlock --no-fade-in
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 300                                                       # 5min.
    on-timeout = ~/bin/brightness-control dim                           # set every screen (laptop + external) to minimum brightness.
    on-resume = ~/bin/brightness-control restore                        # restore the brightness of every screen.
}

listener {
    timeout = 600                                                       # 10min
    on-timeout = loginctl lock-session                                  # lock screen when timeout has passed
}

listener {
    timeout = 630                                                       # 10.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })' # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'   # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1200                                                      # 20min
    on-timeout = systemctl suspend                                      # suspend pc
}
