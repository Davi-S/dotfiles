# Hyprland Keybindings
# ====================
# Reference: https://wiki.hyprland.org/Configuring/Keywords
# Reference: https://wiki.hyprland.org/Configuring/Binds/


##################################
### Define apps and constants ####
##################################

# Remember to always use uwsm to start apps
$uwsm = uwsm app -t service --

$calculator = $uwsm qalculate-gtk

$terminal = $uwsm kitty

# Set rofi to use uwsm to launch apps, but not using uwsm to launch rofi it self
# because rofi will run just for a short period of time, and making it open
# quickly is more important. The point is to make the app that rofi will open to
# be managed by uwsm.
$menu = rofi -show drun -run-command "$uwsm {cmd}"

# clipboard history
# Not using uwsm to launch rofi or cliphist because it will run just for a
# short period of time; making it open quickly is more important
$cliphist = cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Folder where the user custom commands and scripts are
$ubin = ~/bin

$screenshots_folder = ~/Pictures/screenshots

# Not using uwsm here because these terminal/apps will run for a short period of
# time. It is more important to make them open faster.
$bluetooth = $ubin/toggle-float-app bluetui_float "kitty -o confirm_os_window_close=0 --class bluetui_float -e bluetui"
$wifi = $ubin/toggle-float-app impala_float "kitty -o confirm_os_window_close=0 --class impala_float -e impala"
$audio = $ubin/toggle-float-app pulsemixer_float "kitty -o confirm_os_window_close=0 --class pulsemixer_float -e pulsemixer"


#############
### Binds ###
#############

bind = SUPER, Escape, exec, uwsm stop
# Next = PageDown
# For me, using a custom keyboard layout, "PageDown" is basically "M" in terms
# of qwerty layout
bind = SUPER, Next, killactive  
# For me, using a custom keyboard layout, "Return" is basically "Space" in terms
# of qwerty layout
bind = SUPER, Return, exec, $terminal
# For me, using a custom keyboard layout, "HOME" is basically "I" in terms of
# qwerty layout
bind = SUPER, Home, exec, $menu
# Prior = PageUp
# For me, using a custom keyboard layout, "PageUp" is basically "U" in terms of
# qwerty layout
bind = SUPER, Prior, exec, $ubin/datetime-notify 3  
# SUPER+Y is already being triggered by the F5 key.
# I don't know why, but this is the default behaviour of F5 and I didn't manage
# to change it, so I'll make use of it as it is
bind = SUPER, Y, exec, battery-notify 
# For me, using a custom keyboard layout, "Tab" is basically "J" in terms of
# qwerty layout
bind = SUPER, TAB, exec, $cliphist
bind = SUPER, L, exec, hyprlock
bind = SUPER, F, togglefloating
bind = SUPER, P, fullscreen 
bind = SUPER, C, exec, $calculator
bind = SUPER, B, exec, $bluetooth
bind = SUPER, W, exec, $wifi
bind = SUPER, A, exec, $audio
bind = SUPER, M, exec, $ubin/toggle-bluetooth-mic

# Screenshots
# bind = SUPER SHIFT, PRINT, exec, hyprshot -m window -o $screenshots_folder  # Screenshot a window
bind =      , PRINT, exec, hyprshot -m region -o $screenshots_folder  # Screenshot a region
bind = SUPER, PRINT, exec, hyprshot -m output -m eDP-1 -o $screenshots_folder  # Screenshot the main monitor (eDP-1)

# Move focus with SUPER + arrow keys
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Switch workspaces with SUPER + [0-9]
# This apostrophe is on the right side of number 1. This facilidates switching to the last workspace
bind = SUPER, apostrophe, workspace, 10
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
# Special workspace (scratchpad)
bind = SUPER, S, togglespecialworkspace, magic

# Move active window to a workspace with SUPER + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10
# Special workspace (scratchpad)
bind = SUPER SHIFT, S, movetoworkspace, special:magic

# Silently move active window to a workspace with SUPER + ALT + SHIFT + [0-9]
bind = SUPER SHIFT ALT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT ALT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT ALT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT ALT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT ALT, 5, movetoworkspacesilent, 5
bind = SUPER SHIFT ALT, 6, movetoworkspacesilent, 6
bind = SUPER SHIFT ALT, 7, movetoworkspacesilent, 7
bind = SUPER SHIFT ALT, 8, movetoworkspacesilent, 8
bind = SUPER SHIFT ALT, 9, movetoworkspacesilent, 9
bind = SUPER SHIFT ALT, 0, movetoworkspacesilent, 10

# Rearrange window using SUPER + SHIFT + CTRL + arrow keys
bind = SUPER SHIFT CTRL, left, movewindow, l
bind = SUPER SHIFT CTRL, right, movewindow, r
bind = SUPER SHIFT CTRL, up, movewindow, u
bind = SUPER SHIFT CTRL, down, movewindow, d

# Move/resize windows with SUPER + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow


####################################
### Laptop multimedia ("F") keys ###
####################################

# In order from left to right

# F1 - XF86Sleep - Sleep the computer

# F2 - XF86RFKill - Toggle airplane mode
bindel = , XF86RFKill, exec, $ubin/airplane-mode-control status

# F3 and F4 - Brightness control
bindel = , XF86MonBrightnessDown, exec, $ubin/brightness-control -10
bindel = , XF86MonBrightnessUp, exec, $ubin/brightness-control +10

# F5 - Apparently, this is a key combo "SUPER+Y". I don't know why a media key does this, but it does.

# F6 - Toggles the screen on and off. This key is handled by firmware, so there is no override for it
# It does not turn the monitor completely off. It is still possible to see bright stuff on it.
# However, I have no idea how to fix this or get the same behaviour (toggle + wake on input) using other
# key/method, so I'll leave it as is

# F7 - XF86TouchpadOn and XF86TouchpadOff - Toggle touchpad on and off

# F8 - Nothing

# F9 - Mute volume
bindl = , XF86AudioMute, exec, $ubin/volume-control toggle 

# F10 and F11 - Volume control
bindel = , XF86AudioLowerVolume, exec, $ubin/volume-control -5 
bindel = , XF86AudioRaiseVolume, exec, $ubin/volume-control +5 
# Fine tune volume
bindl = SHIFT, XF86AudioLowerVolume, exec, $ubin/volume-control -1 
bindl = SHIFT, XF86AudioRaiseVolume, exec, $ubin/volume-control +1 

# F12 - Scroll_Lock
# bindl = , Scroll_Lock, ...
