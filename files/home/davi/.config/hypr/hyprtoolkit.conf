# hyprtoolkit
# ===========
# Theme for the apps built on hyprtoolkit (the polkit password dialog and
# Hyprland's own small dialogs). Only what differs from the defaults: Catppuccin
# Mocha colors, square corners and the desktop font.
# Defaults: https://github.com/hyprwm/hyprtoolkit/blob/main/src/palette/ConfigManager.cpp

source = ~/.config/hypr/catppuccin-mocha.conf

# Window background, and the background of inputs and buttons
background = $base
base = $base
# Borders of inputs and buttons, like unfocused window borders
alternate_base = $surface1
text = $text
accent = $sapphire
accent_secondary = $sapphire
link_text = $sapphire

rounding_large = 0
rounding_small = 0

font_family = Atkinson Mono NF
font_family_monospace = Atkinson Mono NF
