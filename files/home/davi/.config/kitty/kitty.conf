# Disable sound
enable_audio_bell no

# Cursor animations
# Makes the cursor move to the destined place, instead of disappearing in one
# place and appearing on another
cursor_trail 1
cursor_trail_decay 0.1 0.2

# Set the allowed layouts and they order
enabled_layouts Stack, Grid

# Make it ask for confirmation before closing a window with a running program.
# The ignore-shell part makes it do not ask when no program is running (just the
# shell prompt)
map ctrl+shift+w close_window_with_confirmation ignore-shell

# Move focus to the neighboring window
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

# Map to open a new window in the same cwd as the current one.
# --os-window-class kitty: otherwise the window takes the class of the window
# that started this kitty instance (e.g. obsidian_tui) and window rules would
# move it to that window's workspace
map ctrl+shift+n launch --type=os-window --os-window-class kitty --cwd=current

# Drop the spaces at the end of copied lines (rectangle selections keep them)
strip_trailing_spaces smart

# Keep more output to scroll back through
scrollback_lines 10000

# Set nvim as default pager
scrollback_pager nvim --cmd "set eventignore=FileType" -c "nnoremap q ZQ" -c "call nvim_open_term(0, {})" -c "set nomodified nolist number relativenumber" -c "$" -

# BEGIN_KITTY_THEME
include mocha.conf
# END_KITTY_THEME

# Own color changes on top of the theme. Outside the theme block, so the themes
# kitten does not remove it
include mocha-overrides.conf


# BEGIN_KITTY_FONTS
font_family      family='Atkinson Mono NF' postscript_name=AtkinsonMonoNF-Regular
# END_KITTY_FONTS
