# Floating TUIs
# =============
# Config for the floating TUI windows opened
# by the toggle-float-app keybinds in ~/.config/hypr/hyprland-keybindings.lua.
# Launch with: kitty --config ~/.config/kitty/float-tui.conf ...

include kitty.conf

# These windows are quick toggles; closing them should never ask for
# confirmation.
confirm_os_window_close 0

# bluetui and impala (same author) use plain ANSI colors by default, and bluetui
# cannot be themed at all. Remapping these colors here makes both follow the
# same rules as the rest of the setup, with no config file for either app.
#   green     (color2)   focused border, popups  -> sapphire
#   dark gray (color8)   selected row background -> surface1
#   white     (color15)  selected row text       -> text
# wiremix uses dark gray for unlit parts, so those become surface1 too.
color2  #74c7ec
color8  #45475a
color15 #cdd6f4
