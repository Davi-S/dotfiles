# zydezu/ModernX options. See vendor/ModernX/README.md for the full list.
# Values use yes/no instead of true/false.

# Seekbar handle size (0 ~ 1)
seek_handle_size=0.8

# Accent color 
seekbarfg_color=#74C7EC
seekbar_cache_color=#74C7EC
chapter_marker_color=#74C7EC
hover_effect_color=#74C7EC

# No window title bar / controls (close, minimize, maximize) in borderless/fullscreen
window_top_bar=no
